[workspace]
resolver = "3"
members = [
  "crates/mdview-core",
  "crates/mdview-support",
  "crates/mdview-markdown",
  "crates/mdview-app",
  "crates/mdview-cli",
  "src-tauri",
]
# 裸 `cargo run` / `cargo test` / `cargo build` 只作用于桌面端，不必每次写 -p。
# 需要全 workspace 时仍显式传 --workspace。
default-members = ["src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mdview-core = { path = "crates/mdview-core" }
mdview-support = { path = "crates/mdview-support" }
mdview-markdown = { path = "crates/mdview-markdown" }
mdview-app = { path = "crates/mdview-app" }
ropey = "1"
pulldown-cmark = "0.13"
thiserror = "2"
log = "0.4"
time = { version = "0.3", features = ["formatting", "local-offset"] }
notify = "8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
