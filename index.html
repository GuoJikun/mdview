<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdview</title>
<link rel="stylesheet" href="/src/app.css">
<script>
  // 平台外观要在首帧前定下来：macOS 用系统标题栏，Windows/Linux 用自绘标题栏。
  // 真正的判据在 Rust（与窗口 decorations 一致），这里先用 UA 抢一个初值避免闪一下。
  (function () {
    var mac = /Macintosh|Mac OS X/i.test(navigator.userAgent) || /^Mac/i.test(navigator.platform);
    document.documentElement.classList.add(mac ? 'native-titlebar' : 'custom-titlebar');
  })();
</script>
</head>
<body>
<!-- 自绘标题栏与菜单弹层由 Vue 渲染（TitleBar.vue / MenuPopup.vue） -->
<!-- 自绘纵向滚动条：浏览器原生滚动条纵跨整窗，会压住标题栏和状态栏。
     正文与大纲各一套，共用 .tb-vscroll 的视觉与拖动逻辑 -->
<div id="vscroll" class="tb-vscroll" aria-hidden="true"><div id="vscroll-thumb" class="tb-vscroll-thumb"></div></div>

<!-- 大纲侧栏：标题清单，点击跳正文，滚动时高亮当前节 -->
<nav id="outline" aria-label="文档大纲"></nav>
<div id="outline-scroll" class="tb-vscroll" aria-hidden="true"><div id="outline-scroll-thumb" class="tb-vscroll-thumb"></div></div>
<!-- 内核持有文本真值，这里只有投影：每块一个 <section>，每个停靠点一个元素 -->
<div id="doc" tabindex="-1" spellcheck="false"></div>
<div id="caret"></div>
<!-- preedit 镜像层：组合期间唯一可见的输入反馈，位置贴着 caret -->
<div id="preedit"></div>
<!-- 输入法只能落在真正的可编辑元素上，所以留一个透明输入框承接 IME；
     它同时决定候选窗弹在哪儿（跟着 caret 走） -->
<textarea id="ime" rows="1" autocomplete="off" autocapitalize="off" autocorrect="off"
          spellcheck="false" aria-label="编辑器输入"></textarea>
<div id="bar"></div>
<!-- Vue 覆盖层挂载点：标题栏/菜单/状态栏/toast 都在这里，大纲与正文区刻意
     不放任何 Vue 节点（留洞），鼠标穿透到下面的现有 DOM。 -->
<div id="vue-app"></div>
<script type="module" src="/src/ime.js"></script>
<script type="module" src="/src/caretline.js"></script>
<script type="module" src="/src/dragscroll.js"></script>
<script type="module" src="/src/selection.js"></script>
<script type="module" src="/src/clipboard.js"></script>
<script type="module" src="/src/outline.js"></script>
<script type="module" src="/src/theme.js"></script>
<script type="module" src="/src/app.js"></script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
