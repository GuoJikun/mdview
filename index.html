<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdview</title>
<!-- 首帧前定下皮肤，避免记住 HyperOS 的人每次启动先闪一下 macOS 配色 -->
<script src="/skin-boot.js"></script>
<!-- 样式表放在 head 里用 <link> 直接引，而不是在 main.ts 里 import：
     JS 模块执行完才注入的样式会让首帧白闪一下。 -->
<link rel="stylesheet" href="/src/styles/app.css">
<!-- 皮肤层必须在 app.css 之后：它用同特异性的选择器覆盖外壳颜色与圆角 -->
<link rel="stylesheet" href="/src/styles/skin.css">
<!-- 底材层最后：只有 Rust 确认 DWM 材质生效时才覆盖外壳背景为透明 -->
<link rel="stylesheet" href="/src/styles/backdrop.css">
</head>
<body>
<!-- Lucide 图标 sprite（ISC）。查找栏是静态 DOM、不在 Vue 树里，用 <use> 复用
     同一份路径数据；菜单/弹窗里的 Vue 组件直接 import 组件，不经过这里。 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7" /><path d="M12 19V5" /></symbol>
  <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14" /><path d="m19 12-7 7-7-7" /></symbol>
  <symbol id="i-ellipsis" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /><circle cx="5" cy="12" r="1" /></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></symbol>
  <symbol id="i-replace" viewBox="0 0 24 24">
    <path d="M14 4a1 1 0 0 1 1-1" /><path d="M15 10a1 1 0 0 1-1-1" />
    <path d="M21 4a1 1 0 0 0-1-1" /><path d="M21 9a1 1 0 0 1-1 1" />
    <path d="m3 7 3 3 3-3" /><path d="M6 10V5a2 2 0 0 1 2-2h2" />
    <rect x="3" y="14" width="7" height="7" rx="1" />
  </symbol>
  <symbol id="i-replace-all" viewBox="0 0 24 24">
    <path d="M14 14a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1" /><path d="M14 4a1 1 0 0 1 1-1" />
    <path d="M15 10a1 1 0 0 1-1-1" /><path d="M19 14a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1" />
    <path d="M21 4a1 1 0 0 0-1-1" /><path d="M21 9a1 1 0 0 1-1 1" />
    <path d="m3 7 3 3 3-3" /><path d="M6 10V5a2 2 0 0 1 2-2h2" />
    <rect x="3" y="14" width="7" height="7" rx="1" />
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
</svg>
<!-- 自绘标题栏与菜单弹层由 Vue 渲染（TitleBar.vue / MenuPopup.vue） -->
<!-- 自绘纵向滚动条：浏览器原生滚动条纵跨整窗，会压住标题栏和状态栏。
     正文与大纲各一套，共用 .tb-vscroll 的视觉与拖动逻辑 -->
<div id="vscroll" class="tb-vscroll" aria-hidden="true"><div id="vscroll-thumb" class="tb-vscroll-thumb"></div></div>
<!-- 横向滚动条：源码视图长行不换行时才有内容可滚，纵向/横向共用同一套视觉 -->
<div id="hscroll" class="tb-hscroll" aria-hidden="true"><div id="hscroll-thumb" class="tb-hscroll-thumb"></div></div>

<!-- 文件侧栏：工作区里的 Markdown 目录树，点击切换文档。
     与大纲同列、各占一段——大纲跟当前文档，文件树跟工作区。
     没有工作区时整块不占位（html.has-workspace 控制）。 -->
<aside id="files" aria-label="工作区文件"></aside>
<div id="files-scroll" class="tb-vscroll" aria-hidden="true"><div id="files-scroll-thumb" class="tb-vscroll-thumb"></div></div>
<!-- 大纲侧栏：标题清单，点击跳正文，滚动时高亮当前节 -->
<nav id="outline" aria-label="文档大纲"></nav>
<div id="outline-scroll" class="tb-vscroll" aria-hidden="true"><div id="outline-scroll-thumb" class="tb-vscroll-thumb"></div></div>
<!-- 内核持有文本真值，这里只有投影：每块一个 <section>，每个停靠点一个元素 -->
<div id="doc" tabindex="-1" spellcheck="false"></div>
<!-- 空状态：未命名且没有内容时浮在正文之上，给出「新建 / 打开 / 最近打开」三个入口。
     一有内容（或变成有路径的文件）就撤掉，不参与任何编辑逻辑。 -->
<div id="empty" hidden>
  <div class="empty-card">
    <h1>mdview</h1>
    <p>Rust 内核的 Markdown 编辑器。写点什么，或者打开已有的稿子。</p>
    <div class="empty-actions">
      <button type="button" class="empty-primary" data-empty="new">新建文档<kbd>Ctrl+N</kbd></button>
      <button type="button" data-empty="open">打开文件…<kbd>Ctrl+O</kbd></button>
      <button type="button" data-empty="folder">打开文件夹…<kbd>Ctrl+Shift+O</kbd></button>
    </div>
    <div id="empty-recent" hidden>
      <h2>最近打开</h2>
      <div id="empty-recent-list"></div>
    </div>
    <p class="empty-help">把文件拖进窗口也行。全部快捷键见 <kbd>Ctrl+/</kbd>。</p>
  </div>
</div>
<!-- 源码视图：直接显示与编辑 Markdown 源文本真值（不是渲染后的 HTML）。
     平时隐藏，只有 window.__mdviewMode === 'source' 时由 data-view 切换显示。 -->
<textarea id="source" spellcheck="false" autocomplete="off" autocapitalize="off"
          autocorrect="off" aria-label="Markdown 源码"></textarea>
<div id="caret"></div>
<!-- preedit 镜像层：组合期间唯一可见的输入反馈，位置贴着 caret -->
<div id="preedit"></div>
<!-- 查找替换浮层：Ctrl+F / Ctrl+H 打开，Esc 关闭。
     布局对齐 VSCode：左侧箭头展开替换行，Aa / ab / .* 三个开关在输入框内，
     右侧是命中计数、上/下一个、更多与关闭。事件接线见 editor.ts 的「查找替换」段。 -->
<div id="findbar" hidden>
  <div class="find-row">
    <button type="button" class="find-expand" data-find="toggle-replace" title="切换替换（Ctrl+H）" aria-label="切换替换"><span class="chev"><svg class="i" aria-hidden="true"><use href="#i-chevron-right" /></svg></span></button>
    <div class="find-field">
      <input id="find-input" type="text" placeholder="查找" autocomplete="off" spellcheck="false" aria-label="查找">
      <button type="button" class="find-inline" data-find="case" title="区分大小写（Alt+C）" aria-label="区分大小写">Aa</button>
      <button type="button" class="find-inline" data-find="word" title="全词匹配（Alt+W）" aria-label="全词匹配">ab</button>
      <button type="button" class="find-inline" data-find="regex" title="使用正则表达式（Alt+R）" aria-label="使用正则表达式">.*</button>
    </div>
    <span id="find-count" class="find-count"></span>
    <button type="button" data-find="prev" title="上一个（Shift+Enter）" aria-label="上一个"><svg class="i" aria-hidden="true"><use href="#i-arrow-up" /></svg></button>
    <button type="button" data-find="next" title="下一个（Enter）" aria-label="下一个"><svg class="i" aria-hidden="true"><use href="#i-arrow-down" /></svg></button>
    <button type="button" data-find="more" title="更多选项" aria-label="更多选项" aria-haspopup="true"><svg class="i" aria-hidden="true"><use href="#i-ellipsis" /></svg></button>
    <button type="button" data-find="close" title="关闭（Esc）" aria-label="关闭"><svg class="i" aria-hidden="true"><use href="#i-x" /></svg></button>
    <div id="find-menu" class="find-menu" hidden>
      <button type="button" data-find="in-selection" aria-pressed="false">
        <span class="tick"><svg class="i" aria-hidden="true"><use href="#i-check" /></svg></span>仅在选区内查找
      </button>
    </div>
  </div>
  <div id="find-replace-row" class="find-row" hidden>
    <div class="find-field">
      <input id="replace-input" type="text" placeholder="替换" autocomplete="off" spellcheck="false" aria-label="替换">
      <button type="button" class="find-inline" data-find="preserve" title="保留大小写" aria-label="保留大小写">AB</button>
    </div>
    <button type="button" data-find="replace" title="替换（Ctrl+Alt+Enter 全部替换）" aria-label="替换"><svg class="i" aria-hidden="true"><use href="#i-replace" /></svg></button>
    <button type="button" data-find="replace-all" title="全部替换（Ctrl+Alt+Enter）" aria-label="全部替换"><svg class="i" aria-hidden="true"><use href="#i-replace-all" /></svg></button>
  </div>
</div>
<!-- 链接 / 图片行内编辑：点正文里的链接或图片弹出，Esc / 点空白关闭。 -->
<div id="linkedit" hidden>
  <div class="le-row">
    <label for="link-url">地址</label>
    <input id="link-url" type="text" autocomplete="off" spellcheck="false" aria-label="链接地址">
  </div>
  <div class="le-row">
    <label for="link-text">文字</label>
    <input id="link-text" type="text" autocomplete="off" spellcheck="false" aria-label="链接文字">
  </div>
  <div class="le-actions">
    <button type="button" data-link="open">打开</button>
    <button type="button" data-link="remove">删除</button>
    <button type="button" data-link="close">取消</button>
    <button type="button" data-link="save" class="primary">保存</button>
  </div>
</div>
<!-- 输入法只能落在真正的可编辑元素上，所以留一个透明输入框承接 IME；
     它同时决定候选窗弹在哪儿（跟着 caret 走） -->
<textarea id="ime" rows="1" autocomplete="off" autocapitalize="off" autocorrect="off"
          spellcheck="false" aria-label="编辑器输入"></textarea>
<div id="bar"></div>
<!-- Vue 覆盖层挂载点：标题栏/菜单/状态栏/toast 都在这里，大纲与正文区刻意
     不放任何 Vue 节点（留洞），鼠标穿透到下面的现有 DOM。 -->
<div id="vue-app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
