<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdview</title>
<link rel="stylesheet" href="/src/app.css">
</head>
<body>
<!-- 自绘标题栏与菜单弹层由 Vue 渲染（TitleBar.vue / MenuPopup.vue） -->
<!-- 自绘纵向滚动条：浏览器原生滚动条纵跨整窗，会压住标题栏和状态栏。
     正文与大纲各一套，共用 .tb-vscroll 的视觉与拖动逻辑 -->
<div id="vscroll" class="tb-vscroll" aria-hidden="true"><div id="vscroll-thumb" class="tb-vscroll-thumb"></div></div>
<!-- 横向滚动条：源码视图长行不换行时才有内容可滚，纵向/横向共用同一套视觉 -->
<div id="hscroll" class="tb-hscroll" aria-hidden="true"><div id="hscroll-thumb" class="tb-hscroll-thumb"></div></div>

<!-- 大纲侧栏：标题清单，点击跳正文，滚动时高亮当前节 -->
<nav id="outline" aria-label="文档大纲"></nav>
<div id="outline-scroll" class="tb-vscroll" aria-hidden="true"><div id="outline-scroll-thumb" class="tb-vscroll-thumb"></div></div>
<!-- 内核持有文本真值，这里只有投影：每块一个 <section>，每个停靠点一个元素 -->
<div id="doc" tabindex="-1" spellcheck="false"></div>
<!-- 源码视图：直接显示与编辑 Markdown 源文本真值（不是渲染后的 HTML）。
     平时隐藏，只有 window.__mdviewMode === 'source' 时由 data-view 切换显示。 -->
<textarea id="source" spellcheck="false" autocomplete="off" autocapitalize="off"
          autocorrect="off" aria-label="Markdown 源码"></textarea>
<div id="caret"></div>
<!-- preedit 镜像层：组合期间唯一可见的输入反馈，位置贴着 caret -->
<div id="preedit"></div>
<!-- 查找替换浮层：Ctrl+F / Ctrl+H 打开，Esc 关闭。
     只在编辑区内浮动，不占正文布局；事件接线见 editor.ts 的「查找替换」段。 -->
<div id="findbar" hidden>
  <div class="find-row">
    <input id="find-input" type="text" placeholder="查找" autocomplete="off" spellcheck="false" aria-label="查找">
    <span id="find-count" class="find-count">0/0</span>
    <button type="button" data-find="prev" title="上一个（Shift+Enter）" aria-label="上一个">↑</button>
    <button type="button" data-find="next" title="下一个（Enter）" aria-label="下一个">↓</button>
    <button type="button" data-find="case" title="区分大小写" aria-label="区分大小写">Aa</button>
    <button type="button" data-find="toggle-replace" title="替换（Ctrl+H）" aria-label="替换">替换</button>
    <button type="button" data-find="close" title="关闭（Esc）" aria-label="关闭">×</button>
  </div>
  <div id="find-replace-row" class="find-row" hidden>
    <input id="replace-input" type="text" placeholder="替换为" autocomplete="off" spellcheck="false" aria-label="替换为">
    <button type="button" data-find="replace">替换</button>
    <button type="button" data-find="replace-all">全部替换</button>
  </div>
</div>
<!-- 链接 / 图片行内编辑：点正文里的链接或图片弹出，Esc / 点空白关闭。 -->
<div id="linkedit" hidden>
  <div class="le-row">
    <label for="link-url">地址</label>
    <input id="link-url" type="text" autocomplete="off" spellcheck="false" aria-label="链接地址">
  </div>
  <div class="le-row">
    <label for="link-text">文字</label>
    <input id="link-text" type="text" autocomplete="off" spellcheck="false" aria-label="链接文字">
  </div>
  <div class="le-actions">
    <button type="button" data-link="open">打开</button>
    <button type="button" data-link="remove">删除</button>
    <button type="button" data-link="close">取消</button>
    <button type="button" data-link="save" class="primary">保存</button>
  </div>
</div>
<!-- 输入法只能落在真正的可编辑元素上，所以留一个透明输入框承接 IME；
     它同时决定候选窗弹在哪儿（跟着 caret 走） -->
<textarea id="ime" rows="1" autocomplete="off" autocapitalize="off" autocorrect="off"
          spellcheck="false" aria-label="编辑器输入"></textarea>
<div id="bar"></div>
<!-- Vue 覆盖层挂载点：标题栏/菜单/状态栏/toast 都在这里，大纲与正文区刻意
     不放任何 Vue 节点（留洞），鼠标穿透到下面的现有 DOM。 -->
<div id="vue-app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
